name: Bug report
description: Something does not work the way the documentation says it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The more of this you fill in, the faster it gets fixed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: Steps, and the save class involved if one is. A small class that shows the problem helps most.
      placeholder: |
        1. Declare this save class ...
        2. Press Play and ...
        3. The file has ...
    validations:
      required: true
  - type: input
    id: unity-version
    attributes:
      label: Unity version
      placeholder: "6000.0.67f1"
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: ImplicitSave version
      description: Package Manager, or the version field in package.json.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it happens
      multiple: true
      options:
        - In the editor
        - In a build
        - Both
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and scripting backend
      placeholder: "Android, IL2CPP, managed stripping High"
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Any error or warning, especially the ones starting with [ImplicitSave]. Paste it as text rather than a screenshot.
      render: text
